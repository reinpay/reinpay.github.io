# Reinpay Lab, every hour: seven scams against five rule sets on throwaway wallets.
# Real Reinpay rules and real eth_simulateV1 calls on Robinhood Chain mainnet. No key, no secret, nothing is signed.
name: Reinpay Lab
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reinpay-lab
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: reinpay/reinpay
          path: engine
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the engine
        run: cd engine && npm ci --omit=dev --no-audit --no-fund
      - name: Run the lab
        run: |
          mkdir -p assets/lab/runs
          STAMP=$(date -u +%Y%m%dT%H%MZ)
          node engine/bin/reinpay.js lab run --out="assets/lab/runs/$STAMP.json"
          node .github/lab-index.mjs assets/lab
      - name: Publish
        run: |
          git config user.name "Reinpay Lab"
          git config user.email "lab@reinpay.app"
          git add assets/lab
          git diff --cached --quiet && exit 0
          git commit -m "Reinpay Lab run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
