(() => {

      const fr = "0x" + l.topics[1].slice(26), to = "0x" + l.topics[2].slice(26), v = Number(BigInt(l.data) / 10n ** 16n) / 100; moves++; $("s-moves").textContent = fmt(moves);
      const burn = to === DEAD, A = towerFor(fr), B = burn ? null : towerFor(to);
      if (A) { A.flash = performance.now(); const r = burn ? A.route : A.route.concat((B || A).route.slice().reverse()); lights.push({ r, t: performance.now(), dur: burn ? 2000 : 3200, col: burn ? "#ff8a3d" : "#7aa7ff", done: () => { if (burn) fires.push({ t: performance.now(), amount: v, tx: l.transactionHash }); else if (B) B.flash = performance.now(); } }); }
      if (burn) { log(`🔥 BURN · ${fmt(v)} REINPAY`, "burn"); setTimeout(loadBurned, 2500); }
      else if (performance.now() - lastLog > 600) { log(`REINPAY · ${v < 1 ? v.toFixed(2) : fmt(v)} · ${fr.slice(0, 6)}… → ${to.slice(0, 6)}…`, "rp"); lastLog = performance.now(); }
    });
    if (Math.random() < .3) log(`block #${fmt(n)} · ${ok.at(-1)?.transactions.length ?? "?"} txs`);
  }
  async function loadBurned() { const [d] = await rpc([["eth_call", [{ to: CA, data: "0x70a08231" + "0".repeat(24) + DEAD.slice(2) }, "latest"]]]); if (d) $("s-burned").textContent = (Number(BigInt(d) / 10n ** 16n) / 1e8).toFixed(2) + "M"; }
  async function findLastBurn() {
    const [h] = await rpc([["eth_blockNumber", []]]); if (!h) return; const n = parseInt(h, 16), pad = "0x" + "0".repeat(24) + DEAD.slice(2);
    for (let to = n; to > n - 3_000_000 && !lastBurn; to -= 1_000_000) { let L = null; for (let k = 0; k < 4 && !Array.isArray(L); k++) { if (k) await new Promise((r) => setTimeout(r, 1500 * k)); [L] = await rpc([["eth_getLogs", [{ address: CA, fromBlock: "0x" + Math.max(0, to - 999_999).toString(16), toBlock: "0x" + to.toString(16), topics: [T, null, pad] }]]]); } if (!Array.isArray(L)) return; // a window that cannot be read is never skipped: an older burn must not pose as the last one
      if (L.length) { const l = L[L.length - 1]; lastBurn = { amount: Number(BigInt(l.data) / 10n ** 16n) / 100, tx: l.transactionHash }; } }
  }
  $("replay").onclick = async () => { if (!lastBurn) await findLastBurn(); if (!lastBurn) return; const arr = [...towers.values()], A = arr[Math.floor(Math.random() * arr.length)]; log(`🔥 REPLAY · last burn · ${fmt(lastBurn.amount)} REINPAY`, "burn"); if (A) { A.flash = performance.now(); lights.push({ r: A.route, t: performance.now(), dur: 1600, col: "#ff8a3d", done: () => fires.push({ t: performance.now(), replay: true, ...lastBurn }) }); } else fires.push({ t: performance.now(), replay: true, ...lastBurn }); };
  loadBurned(); blocks(); setInterval(blocks, 2400); findLastBurn();
})();
</script>
